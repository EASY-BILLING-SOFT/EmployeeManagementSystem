<div class="p-8">
    @if(!isFormOpen){
        <div class="flex justify-between mb-2">
            <h1 class="text-xl font-semibold">Departments</h1>
            <button matButton="filled" class="bg-green-500!" (click)="isFormOpen=true">Add</button>
        </div>
        
        <table class="table-auto border-collapse">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                @for(dept of departments;track $index){
                <tr>
                    <td>{{dept.id}}</td>
                    <td>{{dept.name}}</td>
                    <td class="flex gap-4"> 
                        <div class="flex gap-2">
                            <button matButton="filled" (click)="editDepartment(dept)" >Edit</button>
                            <button matButton="filled" class="bg-red-500!" (click)="delete(dept.id)">Delete</button>
                        </div>
                    </td>
                </tr>  
                }
            </tbody>      
        </table>
    } @else {
        <div class="flex">
            <form class="w-[360px] m-auto shadow-lg py-6 px-16" action="">
                <h1 class="text-xl font-semibold mb-2">Add Department</h1>
                <mat-form-field class="w-full">
                <mat-label>Department Name</mat-label>
                <input matInput name="departmentName" [(ngModel)]="departmentName" >
                </mat-form-field>
                
                <div class="w-full flex justify-center">
                    @if(editId!==0){
                        <button type="button" (click)="updateDepartment()" matButton="filled" class="bg-green-500!">Update</button>
                    } @else {
                        <button type="button" (click)="addDepartment()" matButton="filled" class="bg-green-500!">Add</button>                        
                    }
        
                </div>
            </form>
        </div>
    }
</div>
