<header>
  <mat-toolbar class="bg-blue-500!">
    <button (click)="drawer.toggle()" matIconButton class="text-white!" aria-label="Example icon-button with menu icon">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="text-white!">Employee Management System</span>
    <span class="example-spacer"></span>
    <button matIconButton class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
      <mat-icon>favorite</mat-icon>
    </button>
    <button matIconButton class="example-icon" aria-label="Example icon-button with share icon">
      <mat-icon>share</mat-icon>
    </button>
  </mat-toolbar>
</header>
<mat-drawer-container class="" >
  <mat-drawer #drawer class="w-[300px] bg-white shadow-lg" [mode]="'side'" [opened]="true">
    <div class="flex flex-col items-center gap-2 text-blue-700 p-4 ">
      <a routerLink="/">Dashboard</a>
      <a routerLink="/departments">Departments</a>
      <a routerLink="/employee">Employees</a>
    </div>
  </mat-drawer>
  <mat-drawer-content>
    <main class="min-h-screen bg-gray-100">
      <router-outlet></router-outlet>
    </main>
  </mat-drawer-content>
</mat-drawer-container>

<footer></footer>
